[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-parts-optimizer"
version = "0.3.0"
description = "Safety-stock and fill-rate policy optimization for service parts."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "SBroTheLegend"}]
requires-python = ">=3.11"
keywords = ["inventory", "service-parts", "safety-stock", "fill-rate", "working-capital"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
service-parts = "service_parts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
